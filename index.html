<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F5A623">
<title>The Hive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Fraunces:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --amber: #F5A623;
    --amber-dark: #D4851A;
    --amber-light: #FEF3DC;
    --amber-pale: #FFFAF2;
    --off-white: #F8F6F2;
    --white: #FFFFFF;
    --text-dark: #1A1714;
    --text-mid: #5C5750;
    --text-light: #9C958E;
    --border: rgba(0,0,0,0.08);
    --border-mid: rgba(0,0,0,0.14);
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 18px;
    --radius-xl: 24px;
    --nav-h: 68px;
    --header-h: 60px;
    --shadow-sm: 0 1px 4px rgba(0,0,0,0.06), 0 0 0 0.5px rgba(0,0,0,0.06);
    --shadow-md: 0 4px 16px rgba(0,0,0,0.10), 0 0 0 0.5px rgba(0,0,0,0.06);
    --shadow-fab: 0 4px 20px rgba(245,166,35,0.38), 0 2px 8px rgba(0,0,0,0.12);
  }

  html, body {
    height: 100%;
    overflow: hidden;
    font-family: 'DM Sans', sans-serif;
    background: var(--off-white);
    color: var(--text-dark);
    -webkit-font-smoothing: antialiased;
  }

  #app {
    display: flex;
    flex-direction: column;
    height: 100dvh;
    max-width: 480px;
    margin: 0 auto;
    position: relative;
    background: var(--white);
    overflow: hidden;
  }

  /* ── HEADER ── */
  .app-header {
    height: var(--header-h);
    background: var(--white);
    border-bottom: 0.5px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 18px;
    flex-shrink: 0;
    z-index: 1010; /* Au-dessus de Leaflet (1000) */
  }

  .logo {
    font-family: 'Fraunces', serif;
    font-size: 22px;
    font-weight: 700;
    color: var(--text-dark);
    letter-spacing: -0.3px;
  }
  .logo span { color: var(--amber); }
  .header-actions { display: flex; gap: 10px; align-items: center; }

  .icon-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: none;
    background: var(--off-white);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--text-mid);
    font-size: 18px;
  }

  /* ── PAGES ── */
  .pages { flex: 1; overflow: hidden; position: relative; }
  .page {
    position: absolute;
    inset: 0;
    overflow-y: auto;
    overflow-x: hidden;
    opacity: 0;
    pointer-events: none;
    transform: translateY(8px);
    transition: opacity 0.2s ease, transform 0.2s ease;
    background: var(--white);
  }
  .page.active { opacity: 1; pointer-events: all; transform: translateY(0); }

  /* Ajustement spécifique pour la page carte pour éviter le double scroll */
  #page-farms { overflow: hidden; }

  /* ── BOTTOM NAV ── */
  .bottom-nav {
    height: var(--nav-h);
    background: var(--white);
    border-top: 0.5px solid var(--border);
    display: flex;
    align-items: stretch;
    flex-shrink: 0;
    z-index: 1010;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .nav-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    cursor: pointer;
    background: none;
    border: none;
    color: var(--text-light);
    font-size: 10.5px;
    font-weight: 500;
  }
  .nav-item i { font-size: 22px; }
  .nav-item.active { color: var(--amber-dark); }
  .nav-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--amber); opacity: 0; }
  .nav-item.active .nav-dot { opacity: 1; }

  /* ── FAB ── */
  .fab {
    position: absolute;
    bottom: calc(var(--nav-h) + 16px);
    left: 20px;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: var(--amber);
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: var(--shadow-fab);
    z-index: 1005;
    color: white;
    font-size: 24px;
  }

  /* ── HOME ── */
  .home-hero { background: var(--amber-pale); padding: 28px 20px 24px; border-bottom: 0.5px solid var(--border); }
  .home-greeting { font-size: 13px; color: var(--text-light); font-weight: 500; text-transform: uppercase; }
  .home-title { font-family: 'Fraunces', serif; font-size: 26px; font-weight: 700; line-height: 1.25; margin-bottom: 14px; }
  .home-title em { color: var(--amber-dark); font-style: normal; }
  .home-search { display: flex; align-items: center; background: var(--white); border: 0.5px solid var(--border-mid); border-radius: var(--radius-lg); padding: 0 14px; height: 44px; gap: 10px; }
  .home-search input { flex: 1; border: none; outline: none; font-size: 15px; }
  
  .home-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 18px 18px 0; }
  .stat-card { background: var(--off-white); border-radius: var(--radius-md); padding: 14px 12px; text-align: center; border: 0.5px solid var(--border); }
  .stat-num { font-family: 'Fraunces', serif; font-size: 22px; font-weight: 700; }
  .stat-label { font-size: 11px; color: var(--text-light); margin-top: 4px; }
  
  .section-title { font-family: 'Fraunces', serif; font-size: 17px; font-weight: 600; padding: 20px 18px 12px; }
  .quick-actions { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 0 18px; }
  .qa-card { background: var(--white); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 16px 14px; cursor: pointer; display: flex; flex-direction: column; gap: 10px; box-shadow: var(--shadow-sm); }
  .qa-icon { width: 40px; height: 40px; border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; font-size: 20px; }
  .qa-icon.farms { background: #EAF3DE; color: #3B6D11; }
  .qa-icon.deals { background: #FEF3DC; color: #854F0B; }
  .qa-icon.prices { background: #E6F1FB; color: #185FA5; }
  .qa-icon.community { background: #FBEAF0; color: #993556; }
  .qa-name { font-size: 14px; font-weight: 600; }
  .qa-sub { font-size: 12px; color: var(--text-light); }

  /* ── LEAFLET MAP CONTAINERS ── */
  .map-container { position: relative; height: 100%; display: flex; flex-direction: column; }
  .map-filters { display: flex; gap: 8px; padding: 12px 16px; overflow-x: auto; flex-shrink: 0; background: var(--white); border-bottom: 0.5px solid var(--border); z-index: 1005; }
  .map-filters::-webkit-scrollbar { display: none; }
  .filter-pill { display: flex; align-items: center; gap: 5px; padding: 6px 14px; border-radius: 20px; background: var(--off-white); border: 0.5px solid var(--border-mid); font-size: 13px; font-weight: 500; cursor: pointer; }
  .filter-pill.active { background: var(--amber); border-color: var(--amber); color: white; }
  
  /* Zone de la vraie carte */
  .map-area { flex: 1; position: relative; background: #E8EFE6; }
  #leafletMap { width: 100%; height: 100%; }

  /* Custom Leaflet Popup Styles for Theme Match */
  .leaflet-popup-content-wrapper { border-radius: var(--radius-lg); padding: 6px; font-family: 'DM Sans', sans-serif; }
  .popup-title { font-weight: 600; font-size: 14px; color: var(--text-dark); margin-bottom: 2px; }
  .popup-desc { font-size: 12px; color: var(--text-mid); margin-bottom: 6px; }
  .popup-badge { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 20px; background: #EAF3DE; color: #3B6D11; }

  .farms-list { flex-shrink: 0; max-height: 180px; overflow-y: auto; background: var(--white); border-top: 0.5px solid var(--border); z-index: 1005; }
  .farm-row { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 0.5px solid var(--border); cursor: pointer; }
  .farm-icon-wrap { width: 38px; height: 38px; border-radius: var(--radius-md); background: #EAF3DE; display: flex; align-items: center; justify-content: center; color: #3B6D11; }
  .farm-info { flex: 1; }
  .farm-name { font-size: 14px; font-weight: 600; }
  .farm-meta { font-size: 12px; color: var(--text-light); }
  .farm-chip { font-size: 11px; font-weight: 600; padding: 4px 9px; border-radius: 20px; background: #EAF3DE; color: #3B6D11; }

  /* MODAL */
  .modal-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,0.4); z-index: 2000; display: flex; flex-direction: column; justify-content: flex-end; opacity: 0; pointer-events: none; transition: opacity 0.25s; }
  .modal-backdrop.open { opacity: 1; pointer-events: all; }
  .modal-sheet { background: var(--white); border-radius: 20px 20px 0 0; padding: 20px 20px 40px; transform: translateY(100%); transition: transform 0.3s ease; max-height: 85vh; overflow-y: auto; }
  .modal-backdrop.open .modal-sheet { transform: translateY(0); }
  .modal-handle { width: 36px; height: 4px; background: var(--border-mid); border-radius: 2px; margin: 0 auto 20px; }
  .modal-title { font-family: 'Fraunces', serif; font-size: 20px; font-weight: 700; }
  .form-group { margin-bottom: 12px; }
  .form-label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 4px; text-transform: uppercase; }
  .form-input, .form-textarea, .form-select { width: 100%; padding: 10px; border: 0.5px solid var(--border-mid); border-radius: var(--radius-md); font-family: 'DM Sans', sans-serif; }
  .submit-btn { width: 100%; padding: 14px; background: var(--amber); color: white; border: none; border-radius: var(--radius-lg); font-family: 'Fraunces', serif; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 10px; }

  /* TOAST */
  .toast { position: absolute; bottom: calc(var(--nav-h) + 20px); left: 50%; transform: translateX(-50%) translateY(20px); background: var(--text-dark); color: white; padding: 10px 18px; border-radius: var(--radius-lg); font-size: 13.5px; z-index: 3000; opacity: 0; transition: all 0.25s; pointer-events: none; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div id="app">

  <header class="app-header">
    <div class="logo">the <span>hive</span></div>
    <div class="header-actions">
      <button class="icon-btn" onclick="showToast('Coming soon!')"><i class="ti ti-search"></i></button>
    </div>
  </header>

  <div class="pages">

    <div class="page active" id="page-home">
      <div class="home-hero">
        <p class="home-greeting">Welcome back, traveller</p>
        <h1 class="home-title">Find farms, deals<br>& <em>local prices</em></h1>
        <div class="home-search">
          <i class="ti ti-search"></i>
          <input type="text" placeholder="Search...">
        </div>
      </div>

      <div class="home-stats">
        <div class="stat-card"><div class="stat-num" id="stat-count">0</div><div class="stat-label">Farms</div></div>
        <div class="stat-card"><div class="stat-num">12</div><div class="stat-label">Deals</div></div>
        <div class="stat-card"><div class="stat-num">1.2k</div><div class="stat-label">Members</div></div>
      </div>

      <div class="section-title">Explore</div>
      <div class="quick-actions">
        <div class="qa-card" onclick="goTo('farms')">
          <div class="qa-icon farms"><i class="ti ti-map-2"></i></div>
          <div class="qa-name">Interactive Map</div>
        </div>
        <div class="qa-card" onclick="openSubmit()">
          <div class="qa-icon prices"><i class="ti ti-circle-plus"></i></div>
          <div class="qa-name">Contribute</div>
        </div>
      </div>
    </div>

    <div class="page" id="page-farms">
      <div class="map-container">
        <div class="map-filters">
          <button class="filter-pill active" onclick="filterMap('all', this)"><i class="ti ti-map-2"></i> All</button>
          <button class="filter-pill" onclick="filterMap('fruit', this)"><i class="ti ti-apple"></i> Fruit</button>
          <button class="filter-pill" onclick="filterMap('veg', this)"><i class="ti ti-leaf"></i> Vegetables</button>
          <button class="filter-pill" onclick="filterMap('livestock', this)"><i class="ti ti-paw"></i> Livestock</button>
        </div>

        <div class="map-area">
          <div id="leafletMap"></div>
        </div>

        <div class="farms-list" id="list-container">
          </div>
      </div>
    </div>

  </div>

  <button class="fab" onclick="openSubmit()"><i class="ti ti-plus"></i></button>

  <nav class="bottom-nav">
    <button class="nav-item active" onclick="goTo('home')" id="nav-home"><i class="ti ti-home"></i><span>Home</span><div class="nav-dot"></div></button>
    <button class="nav-item" onclick="goTo('farms')" id="nav-farms"><i class="ti ti-map-2"></i><span>Map</span><div class="nav-dot"></div></button>
  </nav>

  <div class="modal-backdrop" id="submitModal" onclick="if(event.target===this) closeSubmit()">
    <div class="modal-sheet">
      <div class="modal-handle"></div>
      <div class="modal-title">Add to the Hive</div>
      <br>
      <div class="form-group">
        <label class="form-label">Type</label>
        <select id="form-type" class="form-select">
          <option value="fruit">Fruit picking</option>
          <option value="veg">Vegetables</option>
          <option value="livestock">Livestock</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Farm Name</label>
        <input type="text" id="form-title" class="form-input" placeholder="e.g. Sunny Orchards">
      </div>
      <div class="form-group">
        <label class="form-label">City / Location</label>
        <input type="text" id="form-location" class="form-input" placeholder="e.g. Mildura, VIC">
      </div>
      <div class="form-group">
        <label class="form-label">Latitude</label>
        <input type="number" step="any" id="form-lat" class="form-input" placeholder="e.g. -34.184">
      </div>
      <div class="form-group">
        <label class="form-label">Longitude</label>
        <input type="number" step="any" id="form-lng" class="form-input" placeholder="e.g. 142.152">
      </div>
      <div class="form-group">
        <label class="form-label">Price / Salary</label>
        <input type="text" id="form-price" class="form-input" placeholder="e.g. $24/hr">
      </div>
      <div class="form-group">
        <label class="form-label">Details</label>
        <textarea id="form-details" class="form-textarea" placeholder="Housing, conditions..."></textarea>
      </div>
      <button class="submit-btn" onclick="submitToGoogleSheets()">Submit Info</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

<script>
  // ⚠️ METS TON URL SHEETDB ICI :
  const SHEETDB_API_URL = "https://sheetdb.io/api/v1/VOTRE_API_ID";

  let map;
  let markersLayer;
  let allFarmsData = [];

  // Init de l'application
  window.addEventListener('DOMContentLoaded', () => {
    initLeafletMap();
    fetchFarmsFromSheets();
  });

  // 1. Initialiser la vraie carte Leaflet
  function initLeafletMap() {
    // On centre par défaut sur le Sud-Est de l'Australie (Melbourne/Sydney area)
    map = L.map('leafletMap').setView([-35.0, 145.0], 5);

    // Fond de carte OpenStreetMap gratuit et propre
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    markersLayer = L.layerGroup().addTo(map);
  }

  // 2. Aller chercher les données sur le Google Sheet via l'API
  async function fetchFarmsFromSheets() {
    try {
      const response = await fetch(SHEETDB_API_URL);
      allFarmsData = await response.json();
      
      // Mettre à jour le compteur sur l'écran d'accueil
      document.getElementById('stat-count').innerText = allFarmsData.length;
      
      // Afficher sur la carte et la liste
      renderFarms('all');
    } catch (error) {
      console.error("Erreur lors de la récupération des données :", error);
      showToast("❌ Could not load database info.");
    }
  }

  // 3. Afficher les marqueurs et la liste (avec filtre)
  function renderFarms(filterType) {
    // Clear existant
    markersLayer.clearLayers();
    const listContainer = document.getElementById('list-container');
    listContainer.innerHTML = '';

    allFarmsData.forEach(farm => {
      if (filterType !== 'all' && farm.type !== filterType) return;

      const lat = parseFloat(farm.lat);
      const lng = parseFloat(farm.lng);

      if (!isNaN(lat) && !isNaN(lng)) {
        // Créer le popup HTML stylisé
        const popupContent = `
          <div class="popup-title">${farm.title}</div>
          <div class="popup-desc">${farm.location}<br>${farm.details}</div>
          <span class="popup-badge">${farm.price || 'N/A'}</span>
        `;

        // Ajouter le marqueur à Leaflet
        const marker = L.marker([lat, lng]).bindPopup(popupContent);
        markersLayer.addLayer(marker);
      }

      // Ajouter à la liste du bas
      const row = document.createElement('div');
      row.className = 'farm-row';
      row.innerHTML = `
        <div class="farm-icon-wrap"><i class="ti ti-plant-2"></i></div>
        <div class="farm-info">
          <div class="farm-name">${farm.title}</div>
          <div class="farm-meta">${farm.location} · ${farm.type}</div>
        </div>
        <span class="farm-chip">${farm.price || 'Check'}</span>
      `;
      
      // Si on clique sur la ligne, la carte se centre sur le marqueur
      row.onclick = () => {
        if (!isNaN(lat) && !isNaN(lng)) {
          map.setView([lat, lng], 9, { animate: true });
        }
      };
      listContainer.appendChild(row);
    });
  }

  // Gestion des boutons filtres
  function filterMap(type, buttonEl) {
    document.querySelectorAll('.filter-pill').forEach(btn => btn.classList.remove('active'));
    buttonEl.classList.add('active');
    renderFarms(type);
  }

  // Navigation entre les pages
  function goTo(page) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    document.getElementById('page-' + page).classList.add('active');
    document.getElementById('nav-' + page).classList.add('active');
    
    // Force Leaflet à recalculer sa taille si on arrive sur la page carte
    if (page === 'farms') {
      setTimeout(() => { map.invalidateSize(); }, 200);
    }
  }

  // 4. Envoyer les données du formulaire vers le Google Sheet
  async function submitToGoogleSheets() {
    const title = document.getElementById('form-title').value.trim();
    const location = document.getElementById('form-location').value.trim();
    const type = document.getElementById('form-type').value;
    const lat = document.getElementById('form-lat').value.trim();
    const lng = document.getElementById('form-lng').value.trim();
    const price = document.getElementById('form-price').value.trim();
    const details = document.getElementById('form-details').value.trim();

    if (!title || !lat || !lng) {
      showToast("⚠️ Name, Lat and Lng are required.");
      return;
    }

    const payload = {
      data: [
        { title, location, type, lat, lng, price, details }
      ]
    };

    showToast("Sending data...");

    try {
      const response = await fetch(SHEETDB_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      if (response.ok) {
        showToast("✅ Successfully saved to Database!");
        closeSubmit();
        // Vider le formulaire
        document.getElementById('form-title').value = '';
        document.getElementById('form-location').value = '';
        document.getElementById('form-lat').value = '';
        document.getElementById('form-lng').value = '';
        document.getElementById('form-price').value = '';
        document.getElementById('form-details').value = '';
        
        // Recharger les données instantanément
        fetchFarmsFromSheets();
      } else {
        showToast("❌ Error saving data.");
      }
    } catch (e) {
      console.error(e);
      showToast("❌ Network error.");
    }
  }

  function openSubmit() { document.getElementById('submitModal').classList.add('open'); }
  function closeSubmit() { document.getElementById('submitModal').classList.remove('open'); }

  let toastTimer;
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.innerText = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 3000);
  }
</script>
</body>
</html>
