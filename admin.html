<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0D0D0F">
<title>The Hive — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0D0D0F;
  --surface:#141416;
  --surface2:#1C1C1F;
  --surface3:#242427;
  --border:rgba(255,255,255,0.06);
  --border-mid:rgba(255,255,255,0.10);
  --amber:#F5A623;
  --amber-dim:#2A1D00;
  --amber-glow:rgba(245,166,35,0.15);
  --green:#34C759;
  --green-dim:#0D2E17;
  --red:#FF453A;
  --red-dim:#2E0D0B;
  --blue:#0A84FF;
  --blue-dim:#0D1F35;
  --purple:#BF5AF2;
  --text:#F0EDE8;
  --text-mid:#9A9590;
  --text-dim:#4A4740;
  --radius:10px;
  --radius-lg:16px;
  --shadow:0 2px 20px rgba(0,0,0,0.5);
  --shadow-lg:0 8px 40px rgba(0,0,0,0.7);
}

html,body{height:100%;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}

/* ── LOGIN ── */
#loginWrap{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:var(--bg);
  background-image:
    radial-gradient(ellipse 600px 400px at 50% 0%, rgba(245,166,35,0.07) 0%, transparent 70%),
    repeating-linear-gradient(0deg, transparent, transparent 39px, rgba(255,255,255,0.02) 39px, rgba(255,255,255,0.02) 40px),
    repeating-linear-gradient(90deg, transparent, transparent 39px, rgba(255,255,255,0.02) 39px, rgba(255,255,255,0.02) 40px);
  z-index:500;
}
.login-card{
  width:100%;max-width:360px;
  background:var(--surface);
  border:0.5px solid var(--border-mid);
  border-radius:20px;
  padding:40px 36px;
  box-shadow:var(--shadow-lg),0 0 0 1px rgba(245,166,35,0.05) inset;
}
.login-wordmark{
  font-family:'Syne',sans-serif;font-size:28px;font-weight:800;letter-spacing:-1px;
  text-align:center;margin-bottom:4px;
}
.login-wordmark span{color:var(--amber)}
.login-sub{text-align:center;font-size:12px;color:var(--text-dim);margin-bottom:32px;letter-spacing:0.4px;text-transform:uppercase;font-weight:600}
.field-group{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.field{
  width:100%;padding:11px 14px;
  background:var(--surface2);
  border:0.5px solid var(--border-mid);
  border-radius:var(--radius);
  font-family:'DM Sans',sans-serif;font-size:14px;
  color:var(--text);outline:none;
  transition:border-color 0.15s,box-shadow 0.15s;
}
.field::placeholder{color:var(--text-dim)}
.field:focus{border-color:rgba(245,166,35,0.5);box-shadow:0 0 0 3px rgba(245,166,35,0.08)}
.btn-primary{
  width:100%;padding:12px;
  background:var(--amber);color:#0D0D0F;
  border:none;border-radius:var(--radius);
  font-family:'Syne',sans-serif;font-size:15px;font-weight:700;letter-spacing:-0.2px;
  cursor:pointer;transition:all 0.15s;
}
.btn-primary:hover{background:#FFB830;box-shadow:0 0 20px rgba(245,166,35,0.3)}
.btn-primary:active{transform:scale(0.98)}
.divider{display:flex;align-items:center;gap:10px;margin:16px 0;color:var(--text-dim);font-size:12px}
.divider::before,.divider::after{content:'';flex:1;height:0.5px;background:var(--border-mid)}
.btn-google{
  width:100%;padding:11px 14px;
  background:var(--surface2);color:var(--text);
  border:0.5px solid var(--border-mid);border-radius:var(--radius);
  font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;
  transition:all 0.15s;
}
.btn-google:hover{border-color:var(--border-mid);background:var(--surface3)}
.btn-google svg{width:16px;height:16px;flex-shrink:0}
.login-err{
  background:rgba(255,69,58,0.12);border:0.5px solid rgba(255,69,58,0.25);
  border-radius:var(--radius);padding:10px 14px;
  font-size:13px;color:var(--red);margin-bottom:14px;display:none;
}
.login-err.show{display:block}

/* ── APP SHELL ── */
#appWrap{display:none;height:100dvh;flex-direction:column}
#appWrap.visible{display:flex}

.topbar{
  height:52px;flex-shrink:0;
  background:var(--surface);
  border-bottom:0.5px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 24px;
  position:relative;z-index:100;
}
.topbar-left{display:flex;align-items:center;gap:16px}
.wordmark{font-family:'Syne',sans-serif;font-size:18px;font-weight:800;letter-spacing:-0.5px}
.wordmark span{color:var(--amber)}
.admin-chip{
  font-size:10px;font-weight:700;letter-spacing:0.8px;text-transform:uppercase;
  background:var(--amber-dim);color:var(--amber);
  padding:3px 9px;border-radius:20px;
  border:0.5px solid rgba(245,166,35,0.2);
}
.topbar-right{display:flex;align-items:center;gap:12px}
.user-label{font-size:13px;color:var(--text-mid)}
.logout-btn{
  display:flex;align-items:center;gap:5px;
  font-family:'DM Sans',sans-serif;font-size:13px;color:var(--text-dim);
  background:none;border:none;cursor:pointer;transition:color 0.15s;padding:4px 0;
}
.logout-btn:hover{color:var(--red)}

/* ── LAYOUT ── */
.body-wrap{flex:1;display:flex;overflow:hidden}
.sidebar{
  width:200px;flex-shrink:0;
  background:var(--surface);
  border-right:0.5px solid var(--border);
  display:flex;flex-direction:column;
  padding:16px 0;
  overflow-y:auto;
}
.sidebar-section{
  font-size:9.5px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;
  color:var(--text-dim);padding:16px 18px 6px;
}
.sidebar-section:first-child{padding-top:6px}
.nav-btn{
  display:flex;align-items:center;gap:9px;
  padding:8px 18px;width:100%;
  font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;
  color:var(--text-mid);background:none;border:none;cursor:pointer;
  transition:all 0.12s;text-align:left;border-radius:0;
  position:relative;
}
.nav-btn:hover{color:var(--text);background:var(--surface2)}
.nav-btn.active{color:var(--amber);background:var(--amber-glow)}
.nav-btn.active::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:2px;
  background:var(--amber);border-radius:0 2px 2px 0;
}
.nav-btn i{font-size:16px;width:18px;flex-shrink:0;text-align:center}
/* On desktop the label is inline text; on mobile CSS hides what we don't need */
.nav-label{}
.nav-count{
  margin-left:auto;
  font-family:'DM Mono',monospace;font-size:10px;font-weight:500;
  background:var(--amber);color:#0D0D0F;
  padding:2px 7px;border-radius:10px;
}
.nav-count.red{background:var(--red);color:white}

.main{flex:1;overflow-y:auto;padding:28px 32px;background:var(--bg)}

/* ── STATS ── */
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:28px}
.stat-box{
  background:var(--surface);border:0.5px solid var(--border);
  border-radius:var(--radius-lg);padding:18px 20px;
}
.stat-num{font-family:'Syne',sans-serif;font-size:30px;font-weight:800;letter-spacing:-1px;line-height:1}
.stat-lbl{font-size:11px;color:var(--text-dim);margin-top:6px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px}
.stat-box.s-pending .stat-num{color:var(--amber)}
.stat-box.s-approved .stat-num{color:var(--green)}
.stat-box.s-rejected .stat-num{color:var(--red)}
.stat-box.s-total .stat-num{color:var(--text)}

/* ── PAGE HEADER ── */
.page-hd{margin-bottom:22px}
.page-title{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;letter-spacing:-0.5px;margin-bottom:3px}
.page-sub{font-size:13px;color:var(--text-dim)}

/* ── FILTERS ROW ── */
.filters-bar{display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.pill{
  padding:5px 13px;border-radius:20px;
  background:var(--surface);border:0.5px solid var(--border-mid);
  font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;
  color:var(--text-mid);cursor:pointer;transition:all 0.12s;
  display:flex;align-items:center;gap:5px;
}
.pill:hover{border-color:rgba(245,166,35,0.3);color:var(--text)}
.pill.active{background:var(--amber-dim);border-color:rgba(245,166,35,0.35);color:var(--amber)}
.search-field{
  margin-left:auto;padding:6px 13px;
  background:var(--surface);border:0.5px solid var(--border-mid);
  border-radius:20px;font-family:'DM Sans',sans-serif;font-size:13px;
  color:var(--text);outline:none;width:190px;
  transition:border-color 0.15s;
}
.search-field::placeholder{color:var(--text-dim)}
.search-field:focus{border-color:rgba(245,166,35,0.4)}

/* ── TABLE ── */
.tbl-wrap{
  background:var(--surface);
  border:0.5px solid var(--border);
  border-radius:var(--radius-lg);
  overflow:hidden;
}
table{width:100%;border-collapse:collapse}
thead tr{background:var(--surface2)}
th{
  font-size:10px;font-weight:700;letter-spacing:0.8px;text-transform:uppercase;
  color:var(--text-dim);padding:10px 16px;text-align:left;
  border-bottom:0.5px solid var(--border);
}
td{
  padding:12px 16px;
  border-bottom:0.5px solid var(--border);
  font-size:13px;vertical-align:middle;
  transition:background 0.1s;
}
tr:last-child td{border-bottom:none}
tbody tr:hover td{background:rgba(255,255,255,0.02)}

/* badges */
.badge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:6px;display:inline-flex;align-items:center;gap:3px;letter-spacing:0.2px;white-space:nowrap}
.b-price{background:var(--blue-dim);color:var(--blue)}
.b-farm{background:var(--green-dim);color:var(--green)}
.b-deal{background:var(--amber-dim);color:var(--amber)}
.b-farm_edit,.b-deal_edit{background:rgba(191,90,242,0.15);color:var(--purple)}
.b-delete_farm,.b-delete_price,.b-delete_deal{background:var(--red-dim);color:var(--red)}
.s-pending{background:rgba(245,166,35,0.12);color:var(--amber)}
.s-approved{background:var(--green-dim);color:var(--green)}
.s-rejected{background:var(--red-dim);color:var(--red)}

/* action buttons */
.act-wrap{display:flex;gap:5px;align-items:center}
.btn-eye{
  width:28px;height:28px;border-radius:7px;
  background:var(--surface2);border:0.5px solid var(--border-mid);
  color:var(--text-mid);display:flex;align-items:center;justify-content:center;
  cursor:pointer;font-size:14px;transition:all 0.12s;
}
.btn-eye:hover{background:var(--surface3);color:var(--text)}
.btn-ok{
  padding:4px 10px;border-radius:7px;
  background:var(--green-dim);color:var(--green);
  border:0.5px solid rgba(52,199,89,0.2);
  font-size:11px;font-weight:700;cursor:pointer;
  font-family:'DM Sans',sans-serif;
  display:flex;align-items:center;gap:3px;
  transition:all 0.12s;white-space:nowrap;
}
.btn-ok:hover{background:var(--green);color:#0D0D0F}
.btn-no{
  padding:4px 10px;border-radius:7px;
  background:var(--red-dim);color:var(--red);
  border:0.5px solid rgba(255,69,58,0.2);
  font-size:11px;font-weight:700;cursor:pointer;
  font-family:'DM Sans',sans-serif;
  display:flex;align-items:center;gap:3px;
  transition:all 0.12s;white-space:nowrap;
}
.btn-no:hover{background:var(--red);color:white}
.mono{font-family:'DM Mono',monospace;font-size:11px;color:var(--text-dim)}
.ellip{max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}

/* ── EMPTY / LOADING ── */
.empty{text-align:center;padding:60px 20px;color:var(--text-dim)}
.empty i{font-size:36px;display:block;margin-bottom:10px;opacity:0.4}
.loading{display:flex;align-items:center;justify-content:center;gap:10px;padding:50px;color:var(--text-dim)}
.spinner{width:18px;height:18px;border:2px solid var(--surface3);border-top-color:var(--amber);border-radius:50%;animation:spin 0.7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── MODAL ── */
.modal-bg{
  position:fixed;inset:0;
  background:rgba(0,0,0,0.7);
  backdrop-filter:blur(4px);
  z-index:300;display:flex;align-items:center;justify-content:center;
  padding:20px;opacity:0;pointer-events:none;transition:opacity 0.2s;
}
.modal-bg.open{opacity:1;pointer-events:all}
.modal{
  background:var(--surface);
  border:0.5px solid var(--border-mid);
  border-radius:20px;
  width:100%;max-width:600px;max-height:88vh;
  overflow-y:auto;
  box-shadow:var(--shadow-lg);
  transform:translateY(16px) scale(0.98);
  transition:transform 0.25s cubic-bezier(0.34,1.56,0.64,1);
}
.modal-bg.open .modal{transform:translateY(0) scale(1)}
.modal-head{
  padding:20px 24px 16px;
  border-bottom:0.5px solid var(--border);
  display:flex;align-items:flex-start;justify-content:space-between;
  position:sticky;top:0;background:var(--surface);z-index:10;
}
.modal-title-text{font-family:'Syne',sans-serif;font-size:17px;font-weight:800;letter-spacing:-0.3px}
.modal-badges{display:flex;gap:6px;margin-top:5px;align-items:center}
.close-btn{
  width:30px;height:30px;border-radius:8px;
  background:var(--surface2);border:none;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:var(--text-mid);font-size:15px;
  transition:all 0.12s;flex-shrink:0;margin-top:2px;
}
.close-btn:hover{background:var(--surface3);color:var(--text)}
.modal-body{padding:20px 24px}
.detail-sec{
  font-size:9.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;
  color:var(--text-dim);margin:18px 0 10px;padding-bottom:7px;
  border-bottom:0.5px solid var(--border);
}
.detail-sec:first-child{margin-top:0}
.detail-row{display:flex;gap:12px;margin-bottom:9px;font-size:13px}
.detail-lbl{font-weight:600;color:var(--text-dim);width:130px;flex-shrink:0;font-size:12px;padding-top:1px}
.detail-val{color:var(--text);flex:1;word-break:break-word;line-height:1.5}
.code-block{
  background:var(--surface2);border-radius:8px;
  padding:10px 12px;font-family:'DM Mono',monospace;font-size:12px;
  color:var(--text-mid);white-space:pre-wrap;margin-top:2px;
}
.hh-chip{
  background:var(--amber-dim);border-radius:8px;padding:8px 12px;margin-bottom:6px;
  font-size:13px;border:0.5px solid rgba(245,166,35,0.15);
}
.ld-chip{
  background:var(--blue-dim);border-radius:8px;padding:8px 12px;
  font-size:13px;border:0.5px solid rgba(10,132,255,0.15);
}
.modal-foot{
  padding:14px 24px;border-top:0.5px solid var(--border);
  display:flex;gap:8px;justify-content:flex-end;
  position:sticky;bottom:0;background:var(--surface);
}
.btn-lg-ok{
  padding:10px 22px;background:var(--green);color:#0D0D0F;
  border:none;border-radius:var(--radius);
  font-family:'Syne',sans-serif;font-size:14px;font-weight:700;
  cursor:pointer;display:flex;align-items:center;gap:6px;transition:all 0.15s;
}
.btn-lg-ok:hover{background:#28a745;box-shadow:0 0 20px rgba(52,199,89,0.3)}
.btn-lg-no{
  padding:10px 22px;background:var(--red-dim);color:var(--red);
  border:0.5px solid rgba(255,69,58,0.25);border-radius:var(--radius);
  font-family:'Syne',sans-serif;font-size:14px;font-weight:700;
  cursor:pointer;display:flex;align-items:center;gap:6px;transition:all 0.15s;
}
.btn-lg-no:hover{background:var(--red);color:white}

/* ── TOAST ── */
.toast{
  position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--surface3);color:var(--text);
  border:0.5px solid var(--border-mid);
  padding:10px 20px;border-radius:30px;
  font-size:14px;font-weight:500;z-index:999;
  opacity:0;transition:all 0.3s;white-space:nowrap;
  box-shadow:var(--shadow);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.ok{background:#0D2E17;color:var(--green);border-color:rgba(52,199,89,0.25)}
.toast.err{background:var(--red-dim);color:var(--red);border-color:rgba(255,69,58,0.25)}

/* ── USERS ── */
.uavatar{
  width:30px;height:30px;border-radius:50%;
  background:var(--amber-dim);display:inline-flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;color:var(--amber);flex-shrink:0;
}

/* ── SCROLLBAR ── */
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--surface3);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--border-mid)}

/* ════════════════════════════════════════
   MOBILE — everything ≤ 768px
   ════════════════════════════════════════ */
@media (max-width: 768px) {

  /* Safe areas for notched phones */
  html, body { height: 100%; overflow: hidden; }

  /* ── TOPBAR ── */
  .topbar {
    height: calc(52px + env(safe-area-inset-top, 0px));
    padding: env(safe-area-inset-top, 0px) 16px 0;
    align-items: flex-end;
    padding-bottom: 10px;
  }
  .user-label { display: none; }
  .admin-chip { font-size: 9px; padding: 2px 7px; }
  .wordmark { font-size: 16px; }
  .logout-btn span { display: none; }

  /* ── LAYOUT: sidebar becomes bottom tab bar ── */
  .body-wrap { flex-direction: column; }

  .sidebar {
    width: 100%;
    height: calc(52px + env(safe-area-inset-bottom, 0px));
    flex-direction: row;
    padding: 0;
    padding-bottom: env(safe-area-inset-bottom, 0px);
    border-right: none;
    border-top: 0.5px solid var(--border);
    order: 2;
    overflow: hidden;
    position: relative;
    z-index: 50;
    flex-shrink: 0;
  }

  /* Hide sidebar section labels on mobile */
  .sidebar-section { display: none; }

  .nav-btn {
    flex: 1;
    flex-direction: column;
    gap: 2px;
    padding: 6px 4px 4px;
    font-size: 9.5px;
    font-weight: 600;
    letter-spacing: 0.2px;
    text-align: center;
    justify-content: center;
    align-items: center;
    border-radius: 0;
  }
  .nav-btn::before { display: none; } /* remove the left accent bar */
  .nav-btn i { font-size: 20px; width: auto; }
  .nav-btn.active { color: var(--amber); background: transparent; }
  /* Amber dot above active tab */
  .nav-btn.active::after {
    content: '';
    position: absolute;
    top: 5px;
    left: 50%;
    transform: translateX(-50%);
    width: 4px; height: 4px;
    border-radius: 50%;
    background: var(--amber);
  }

  .nav-count {
    font-size: 8px;
    padding: 1px 5px;
    position: absolute;
    top: 6px;
    right: calc(50% - 18px);
  }

  /* ── MAIN CONTENT ── */
  .main {
    padding: 16px 16px 10px;
    order: 1;
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }

  /* ── STATS GRID: 2×2 on mobile ── */
  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-bottom: 16px;
  }
  .stat-box { padding: 14px 16px; border-radius: 12px; }
  .stat-num { font-size: 24px; }
  .stat-lbl { font-size: 10px; margin-top: 4px; }

  /* ── PAGE HEADER ── */
  .page-hd { margin-bottom: 14px; }
  .page-title { font-size: 18px; }

  /* ── FILTERS BAR ── */
  .filters-bar {
    gap: 6px;
    margin-bottom: 12px;
    flex-wrap: nowrap;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    padding-bottom: 2px;
  }
  .filters-bar::-webkit-scrollbar { display: none; }
  .pill { padding: 5px 11px; font-size: 12px; white-space: nowrap; flex-shrink: 0; }
  .search-field {
    margin-left: 0;
    width: 100%;
    min-width: 120px;
    flex-shrink: 0;
  }
  /* Move search to its own row */
  .filters-bar { flex-wrap: wrap; }
  .search-field { order: 10; flex: 1 1 100%; border-radius: 10px; }

  /* ── TABLE → CARD LIST ── */
  .tbl-wrap { background: transparent; border: none; border-radius: 0; overflow: visible; }
  table { display: block; }
  thead { display: none; }
  tbody { display: flex; flex-direction: column; gap: 8px; }
  tr {
    display: block;
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 14px 14px 12px;
    position: relative;
  }
  tr:last-child td { border-bottom: none; }
  td {
    display: block;
    padding: 0;
    border: none;
    background: transparent !important;
    font-size: 13px;
  }

  /* Card layout: badge+date row, name, location, actions */
  td:nth-child(1) { /* ID — hide */
    display: none;
  }
  td:nth-child(2) { /* Type badge */
    position: absolute;
    top: 12px;
    right: 14px;
  }
  td:nth-child(3) { /* Business name */
    font-weight: 700;
    font-size: 14px;
    margin-bottom: 4px;
    padding-right: 70px; /* avoid overlap with badge */
  }
  td:nth-child(3) .ellip { max-width: none; }
  td:nth-child(4) { /* Location */
    color: var(--text-mid);
    font-size: 12px;
    margin-bottom: 3px;
  }
  td:nth-child(5) { /* Item/details */
    color: var(--text-dim);
    font-size: 12px;
    margin-bottom: 8px;
  }
  td:nth-child(5) .ellip { max-width: none; }
  td:nth-child(6) { /* Date */
    position: absolute;
    top: 36px;
    right: 14px;
    font-size: 10px;
    color: var(--text-dim);
  }
  td:nth-child(7) { /* Status badge */
    margin-bottom: 10px;
  }
  td:nth-child(8) { /* Actions */
    display: flex;
    gap: 8px;
  }

  /* Action buttons: full-width feel */
  .act-wrap { width: 100%; }
  .btn-eye {
    width: 38px; height: 38px;
    border-radius: 10px;
    font-size: 16px;
    flex-shrink: 0;
  }
  .btn-ok, .btn-no {
    flex: 1;
    justify-content: center;
    padding: 9px 12px;
    font-size: 13px;
    border-radius: 10px;
  }

  /* Generic table (farms/deals/prices) */
  table:not(:has(#subBody)) thead { display: none; }
  /* Keep generic tables as scroll tables (less critical) */

  /* ── MODAL: full-screen sheet ── */
  .modal-bg { padding: 0; align-items: flex-end; }
  .modal {
    max-width: 100%;
    width: 100%;
    max-height: 92dvh;
    border-radius: 20px 20px 0 0;
    transform: translateY(100%);
    transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
  }
  .modal-bg.open .modal { transform: translateY(0); }
  /* Drag handle */
  .modal::before {
    content: '';
    display: block;
    width: 36px; height: 4px;
    border-radius: 2px;
    background: var(--surface3);
    margin: 10px auto 0;
  }
  .modal-head { padding: 12px 20px 14px; }
  .modal-title-text { font-size: 16px; }
  .modal-body { padding: 16px 20px; }
  .detail-lbl { width: 90px; font-size: 11px; }
  .modal-foot {
    padding: 12px 20px;
    padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
    gap: 10px;
  }
  .btn-lg-ok, .btn-lg-no {
    flex: 1;
    justify-content: center;
    padding: 13px;
    font-size: 15px;
  }

  /* ── USERS TABLE ── */
  /* keep users table as-is but wrap */
  .tbl-wrap table { min-width: 0; }

  /* ── TOAST ── */
  .toast {
    bottom: calc(60px + env(safe-area-inset-bottom, 0px) + 10px);
    font-size: 13px;
    padding: 9px 18px;
  }
}

/* Tiny phones */
@media (max-width: 380px) {
  .nav-btn { font-size: 8.5px; }
  .nav-btn i { font-size: 18px; }
  .main { padding: 12px 12px 8px; }

<script>
const SUPA_URL = 'https://xcazqvhxwjkqemumxvbu.supabase.co';
const SUPA_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhjYXpxdmh4d2prcWVtdW14dmJ1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzOTUyNzQsImV4cCI6MjA5NTk3MTI3NH0.AaUIUoCGyyde8yPcEGDwtANamxLRPpeTaaI7zntkcYM';

let currentUser = null;
let currentPage = 'pending';
let allSubmissions = [];

// ── UTILS ──
const _d = document.createElement('div');
function esc(s){ _d.textContent = String(s||''); return _d.innerHTML; }

function toast(msg, type=''){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type ? ' '+type : '');
  setTimeout(()=>t.className='toast', 3000);
}

function typeName(t){
  return {price:'Price',farm:'Farm',deal:'Deal',farm_edit:'Farm Edit',deal_edit:'Deal Edit',
    delete_farm:'Delete Farm',delete_price:'Delete Price',delete_deal:'Delete Deal'}[t] || t;
}

// ── AUTH ──
async function doLogin(){
  const email = document.getElementById('loginEmail').value.trim();
  const pw = document.getElementById('loginPw').value;
  const errEl = document.getElementById('loginErr');
  errEl.className = 'login-err';

  try {
    const res = await fetch(`${SUPA_URL}/auth/v1/token?grant_type=password`,{
      method:'POST',
      headers:{'apikey':SUPA_ANON,'Content-Type':'application/json'},
      body:JSON.stringify({email,password:pw})
    });
    const data = await res.json();
    if(data.error || !data.access_token){
      errEl.textContent = data.error_description || 'Invalid credentials';
      errEl.className = 'login-err show'; return;
    }
    const isAdmin = await checkAdmin(data.access_token);
    if(!isAdmin){
      errEl.textContent = 'Access denied — not an admin account.';
      errEl.className = 'login-err show'; return;
    }
    enterAdmin({email, token: data.access_token});
  } catch(e){
    errEl.textContent = 'Connection error';
    errEl.className = 'login-err show';
  }
}

async function checkAdmin(token){
  const r = await fetch(`${SUPA_URL}/rest/v1/rpc/is_admin`,{
    method:'POST',
    headers:{'apikey':SUPA_ANON,'Authorization':`Bearer ${token}`,'Content-Type':'application/json'},
    body:'{}'
  });
  return r.json();
}

function doLogout(){
  currentUser = null;
  document.getElementById('appWrap').className = '';
  document.getElementById('loginWrap').style.display = 'flex';
  document.getElementById('loginPw').value = '';
}

async function doGoogleLogin(){
  const authUrl = `${SUPA_URL}/auth/v1/authorize?provider=google&redirect_to=${encodeURIComponent(window.location.href)}`;
  window.location.href = authUrl;
}

document.getElementById('loginPw').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });

// OAuth callback
(async function handleOAuth(){
  const hash = window.location.hash;
  if(!hash.includes('access_token')) return;
  const params = new URLSearchParams(hash.slice(1));
  const token = params.get('access_token');
  if(!token) return;
  try {
    const r = await fetch(`${SUPA_URL}/auth/v1/user`,{headers:{'apikey':SUPA_ANON,'Authorization':`Bearer ${token}`}});
    const user = await r.json();
    if(!user || user.error) throw new Error('bad session');
    const isAdmin = await checkAdmin(token);
    history.replaceState(null,'',window.location.pathname);
    if(!isAdmin){
      const e = document.getElementById('loginErr');
      e.textContent = 'Access denied — this Google account is not an admin.';
      e.className = 'login-err show'; return;
    }
    enterAdmin({email: user.email || user.user_metadata?.email || '', token});
  } catch(e){
    const el = document.getElementById('loginErr');
    el.textContent = 'Google login failed — try again.';
    el.className = 'login-err show';
  }
})();

function enterAdmin(user){
  currentUser = user;
  document.getElementById('loginWrap').style.display = 'none';
  document.getElementById('appWrap').className = 'visible';
  document.getElementById('userLabel').textContent = user.email;
  loadPage('pending');
}

// ── API ──
async function api(table, params='', method='GET', body=null){
  const url = `${SUPA_URL}/rest/v1/${table}${params?'?'+params:''}`;
  const opts = {
    method,
    headers:{
      'apikey':SUPA_ANON,
      'Authorization':`Bearer ${currentUser.token}`,
      'Content-Type':'application/json',
      'Prefer':'return=representation'
    }
  };
  if(body) opts.body = JSON.stringify(body);
  const r = await fetch(url, opts);
  if(!r.ok) throw new Error(await r.text());
  const t = await r.text();
  return t ? JSON.parse(t) : [];
}

async function rpc(name, body={}){
  const r = await fetch(`${SUPA_URL}/rest/v1/rpc/${name}`,{
    method:'POST',
    headers:{'apikey':SUPA_ANON,'Authorization':`Bearer ${currentUser.token}`,'Content-Type':'application/json'},
    body:JSON.stringify(body)
  });
  if(!r.ok) throw new Error(await r.text());
  const t = await r.text();
  return t ? JSON.parse(t) : null;
}

// ── NAVIGATION ──
function setPage(page){
  currentPage = page;
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('nav-'+page)?.classList.add('active');
  loadPage(page);
}

async function loadPage(page){
  const main = document.getElementById('mainContent');
  main.innerHTML = '<div class="loading"><div class="spinner"></div> Loading…</div>';
  try {
    if(page==='pending') await renderSubmissions('pending');
    else if(page==='all') await renderSubmissions('all');
    else if(page==='users') await renderUsers();
    else if(page==='farms') await renderGenericTable('businesses','Farms',['id','business_name','city','country','status']);
    else if(page==='deals') await renderGenericTable('deals','Deals',['id','business_name','city','country','status']);
    else if(page==='prices') await renderGenericTable('local_prices','Local Prices',['id','business_name','item_name','price_normal','city','status']);
  } catch(e){
    main.innerHTML = `<div class="empty"><i class="ti ti-alert-triangle"></i>${esc(e.message)}</div>`;
  }
}

// ── PENDING BADGE ──
async function refreshBadge(){
  try {
    const rows = await api('submissions','admin_decision=eq.pending&select=id');
    const el = document.getElementById('pendingCount');
    if(el) el.textContent = rows.length;
  } catch(e){}
}

// ── SUBMISSIONS ──
let currentTypeFilter = 'all';
let currentSearch = '';

async function renderSubmissions(filter){
  const isPending = filter === 'pending';
  const res = await fetch(`${SUPA_URL}/rest/v1/rpc/admin_get_submissions`,{
    method:'POST',
    headers:{'apikey':SUPA_ANON,'Authorization':`Bearer ${currentUser.token}`,'Content-Type':'application/json'},
    body:JSON.stringify({p_filter: isPending ? 'pending' : 'all'})
  });
  allSubmissions = await res.json();
  await refreshBadge();
  currentTypeFilter = 'all';
  currentSearch = '';

  // Stats
  const pending = allSubmissions.filter(s=>s.admin_decision==='pending').length;
  const approved = allSubmissions.filter(s=>s.admin_decision==='approved').length;
  const rejected = allSubmissions.filter(s=>s.admin_decision==='rejected').length;

  document.getElementById('mainContent').innerHTML = `
    <div class="page-hd">
      <div class="page-title">${isPending ? 'Pending Review' : 'All Submissions'}</div>
      <div class="page-sub">${allSubmissions.length} submission${allSubmissions.length!==1?'s':''}</div>
    </div>

    <div class="stats-grid">
      <div class="stat-box s-pending">
        <div class="stat-num">${pending}</div>
        <div class="stat-lbl">Pending</div>
      </div>
      <div class="stat-box s-approved">
        <div class="stat-num">${approved}</div>
        <div class="stat-lbl">Approved</div>
      </div>
      <div class="stat-box s-rejected">
        <div class="stat-num">${rejected}</div>
        <div class="stat-lbl">Rejected</div>
      </div>
      <div class="stat-box s-total">
        <div class="stat-num">${allSubmissions.length}</div>
        <div class="stat-lbl">Total</div>
      </div>
    </div>

    <div class="filters-bar">
      <button class="pill active" onclick="filterType(this,'all')">All</button>
      <button class="pill" onclick="filterType(this,'price')"><i class="ti ti-coin"></i> Prices</button>
      <button class="pill" onclick="filterType(this,'farm')"><i class="ti ti-plant-2"></i> Farms</button>
      <button class="pill" onclick="filterType(this,'deal')"><i class="ti ti-tag"></i> Deals</button>
      <button class="pill" onclick="filterType(this,'farm_edit')"><i class="ti ti-edit"></i> Edits</button>
      <input class="search-field" placeholder="Search…" id="subSearch" oninput="filterSearch(this.value)">
    </div>

    <div class="tbl-wrap">
      <table>
        <thead><tr>
          <th>ID</th><th>Type</th><th>Business</th><th>Location</th><th>Item / Details</th>
          <th>Submitted</th><th>Status</th><th>Actions</th>
        </tr></thead>
        <tbody id="subBody">${renderSubRows(allSubmissions)}</tbody>
      </table>
    </div>`;
}

function renderSubRows(rows){
  if(!rows.length) return `<tr><td colspan="8"><div class="empty"><i class="ti ti-inbox"></i>Nothing here</div></td></tr>`;
  return rows.map(s=>{
    const date = new Date(s.submission_date).toLocaleDateString('en',{day:'numeric',month:'short'});
    const time = new Date(s.submission_date).toLocaleTimeString('en',{hour:'2-digit',minute:'2-digit'});
    const loc = [s.city,s.country].filter(Boolean).join(', ') || '—';
    const detail = s.item_name
      ? `${s.item_name}${s.item_price?' — $'+s.item_price:''}`
      : (s.details||'').substring(0,50) || '—';
    return `<tr>
      <td class="mono">#${s.id}</td>
      <td><span class="badge b-${s.type}">${typeName(s.type)}</span></td>
      <td style="font-weight:600"><span class="ellip">${esc(s.business_name||'—')}</span></td>
      <td style="color:var(--text-mid)">${esc(loc)}</td>
      <td style="color:var(--text-mid)"><span class="ellip">${esc(detail)}</span></td>
      <td class="mono" title="${esc(date+' '+time)}">${esc(date)}</td>
      <td><span class="badge s-${s.admin_decision}">${s.admin_decision}</span></td>
      <td>
        <div class="act-wrap">
          <button class="btn-eye" onclick="openDetail(${s.id})" title="View details"><i class="ti ti-eye"></i></button>
          ${s.admin_decision==='pending' ? `
          <button class="btn-ok" onclick="decide(${s.id},'approved')"><i class="ti ti-check"></i> Approve</button>
          <button class="btn-no" onclick="decide(${s.id},'rejected')"><i class="ti ti-x"></i></button>` : ''}
        </div>
      </td>
    </tr>`;
  }).join('');
}

function filterType(btn, type){
  currentTypeFilter = type;
  document.querySelectorAll('.filters-bar .pill').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  applyFilters();
}
function filterSearch(val){
  currentSearch = val.toLowerCase();
  applyFilters();
}
function applyFilters(){
  let f = allSubmissions;
  if(currentTypeFilter!=='all') f = f.filter(s=>s.type===currentTypeFilter);
  if(currentSearch) f = f.filter(s=>
    (s.business_name||'').toLowerCase().includes(currentSearch)||
    (s.city||'').toLowerCase().includes(currentSearch)||
    (s.item_name||'').toLowerCase().includes(currentSearch)
  );
  document.getElementById('subBody').innerHTML = renderSubRows(f);
}

// ── DECIDE ──
async function decide(id, decision){
  try {
    const sub = allSubmissions.find(x=>x.id===id);

    if(decision==='approved' && sub && ['delete_farm','delete_price','delete_deal'].includes(sub.type)){
      const nameMatch = (sub.business_name||'').match(/ID:\s*(.+)$/i);
      const detailMatch = (sub.details||'').match(/\(ref:\s*(.+?)\)$/i);
      const refId = sub.target_id ||(nameMatch&&nameMatch[1].trim())||(detailMatch&&detailMatch[1].trim());

      if(!refId){ toast('Could not find target ID','err'); return; }

      if(sub.type==='delete_price'){
        const parts = refId.split('|');
        const looksLikeId = /^P\d+$/i.test(parts[0]) || /^[0-9a-f-]{36}$/.test(parts[0]);
        if(looksLikeId){
          for(const priceId of parts.filter(Boolean)){
            await rpc('admin_delete_local_price',{p_id:priceId});
          }
        } else if(parts.length>=3){
          const [bizName,lat,lng] = parts;
          const rows = await api('local_prices',`business_name=eq.${encodeURIComponent(bizName)}&latitude=eq.${encodeURIComponent(lat)}&longitude=eq.${encodeURIComponent(lng)}&select=id`);
          for(const row of rows) await rpc('admin_delete_local_price',{p_id:row.id});
        } else { toast('Invalid price key','err'); return; }
      } else {
        const rpcName = sub.type==='delete_deal' ? 'admin_delete_deal' : 'admin_delete_business';
        await rpc(rpcName, {p_id: refId});
      }
    }

    await rpc('admin_decide_submission',{p_submission_id:id, p_decision:decision});
    toast(decision==='approved' ? '✅ Approved!' : '❌ Rejected', decision==='approved'?'ok':'err');
    closeModal();
    await loadPage(currentPage);
  } catch(e){ toast('Error: '+e.message,'err'); }
}

// ── DETAIL MODAL ──
function openDetail(id){
  const s = allSubmissions.find(x=>x.id===id);
  if(!s) return;

  const date = new Date(s.submission_date).toLocaleString('en');
  const loc = [s.address,s.city,s.state_region,s.country].filter(Boolean).join(', ');
  const coords = s.latitude&&s.longitude ? `${s.latitude}, ${s.longitude}` : '—';
  const mapsUrl = s.latitude&&s.longitude ? `https://maps.google.com/?q=${s.latitude},${s.longitude}` : null;

  let hhHtml = '';
  if(s.happy_hour_prices?.length){
    hhHtml = `<div class="detail-sec">Happy Hour</div>` +
      s.happy_hour_prices.map(h=>`
        <div class="hh-chip">
          <strong>$${h.price}</strong> · ${h.from}–${h.to} · ${(h.days||[]).join(', ')}
          ${h.item_scopes?.length ? ` · <em>${h.item_scopes.join(', ')}</em>` : ''}
        </div>`).join('');
  }

  let ldHtml = '';
  if(s.local_discount){
    ldHtml = `<div class="detail-sec">Local Discount</div>
      <div class="ld-chip">
        ${s.local_discount.type==='percent' ? s.local_discount.value+'%' : '$'+s.local_discount.value} off
        ${s.local_discount.scope ? ` · ${s.local_discount.scope}` : ''}
      </div>`;
  }

  document.getElementById('modalInner').innerHTML = `
    <div class="modal-head">
      <div>
        <div class="modal-title-text">${esc(s.business_name||'Submission #'+s.id)}</div>
        <div class="modal-badges">
          <span class="badge b-${s.type}">${typeName(s.type)}</span>
          <span class="badge s-${s.admin_decision}">${s.admin_decision}</span>
        </div>
      </div>
      <button class="close-btn" onclick="closeModal()"><i class="ti ti-x"></i></button>
    </div>
    <div class="modal-body">
      <div class="detail-sec">Submission</div>
      <div class="detail-row"><span class="detail-lbl">ID</span><span class="detail-val mono">#${s.id}</span></div>
      <div class="detail-row"><span class="detail-lbl">Submitted</span><span class="detail-val">${esc(date)}</span></div>
      <div class="detail-row"><span class="detail-lbl">Email</span><span class="detail-val">${esc(s.submitted_by_email||'Anonymous')}</span></div>

      <div class="detail-sec">Location</div>
      <div class="detail-row"><span class="detail-lbl">Address</span><span class="detail-val">${esc(loc||'—')}</span></div>
      <div class="detail-row"><span class="detail-lbl">Coordinates</span><span class="detail-val">
        ${esc(coords)}
        ${mapsUrl ? `<a href="${mapsUrl}" target="_blank" style="margin-left:8px;color:var(--blue);font-size:12px;"><i class="ti ti-map-pin"></i> Map</a>` : ''}
      </span></div>

      ${s.item_name ? `
        <div class="detail-sec">Item</div>
        <div class="detail-row"><span class="detail-lbl">Name</span><span class="detail-val">${esc(s.item_name)}</span></div>
        <div class="detail-row"><span class="detail-lbl">Price</span><span class="detail-val">${s.item_price?'$'+s.item_price:'—'}</span></div>
        <div class="detail-row"><span class="detail-lbl">Category</span><span class="detail-val">${esc(s.item_category||'—')}</span></div>
      ` : ''}

      ${hhHtml}
      ${ldHtml}

      ${s.details ? `
        <div class="detail-sec">Details / Notes</div>
        <div class="code-block">${esc(s.details)}</div>
      ` : ''}

      ${s.admin_notes ? `
        <div class="detail-sec">Admin Notes</div>
        <div class="code-block">${esc(s.admin_notes)}</div>
      ` : ''}
    </div>
    ${s.admin_decision==='pending' ? `
    <div class="modal-foot">
      <button class="btn-lg-no" onclick="decide(${s.id},'rejected')"><i class="ti ti-x"></i> Reject</button>
      <button class="btn-lg-ok" onclick="decide(${s.id},'approved')"><i class="ti ti-check"></i> Approve</button>
    </div>` : ''}`;

  document.getElementById('modalBg').classList.add('open');
}

function maybeCloseModal(e){ if(e.target===document.getElementById('modalBg')) closeModal(); }
function closeModal(){ document.getElementById('modalBg').classList.remove('open'); }
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });

// ── USERS ──
async function renderUsers(){
  const subs = await api('submissions','select=submitted_by_email&submitted_by_email=not.is.null');
  const emails = [...new Set(subs.map(s=>s.submitted_by_email).filter(Boolean))];
  const isMobile = window.innerWidth <= 768;

  if(isMobile){
    document.getElementById('mainContent').innerHTML = `
      <div class="page-hd">
        <div class="page-title">Users</div>
        <div class="page-sub">${emails.length} unique submitters</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:8px;">
        ${emails.length ? emails.map(email=>{
          const count = subs.filter(s=>s.submitted_by_email===email).length;
          const initials = email.substring(0,2).toUpperCase();
          return `<div style="background:var(--surface);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:12px 16px;display:flex;align-items:center;gap:12px;">
            <div class="uavatar">${initials}</div>
            <div style="flex:1;min-width:0;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(email)}</div>
            <div class="mono" style="flex-shrink:0;">${count}</div>
          </div>`;
        }).join('') : `<div class="empty"><i class="ti ti-users"></i>No users yet</div>`}
      </div>`;
    return;
  }

  document.getElementById('mainContent').innerHTML = `
    <div class="page-hd">
      <div class="page-title">Users</div>
      <div class="page-sub">${emails.length} unique submitters</div>
    </div>
    <div class="tbl-wrap">
      <table>
        <thead><tr><th>Email</th><th>Submissions</th></tr></thead>
        <tbody>
          ${emails.length ? emails.map(email=>{
            const count = subs.filter(s=>s.submitted_by_email===email).length;
            const initials = email.substring(0,2).toUpperCase();
            return `<tr>
              <td style="display:flex;align-items:center;gap:10px">
                <div class="uavatar">${initials}</div>${esc(email)}
              </td>
              <td class="mono">${count}</td>
            </tr>`;
          }).join('') : '<tr><td colspan="2"><div class="empty"><i class="ti ti-users"></i>No users yet</div></td></tr>'}
        </tbody>
      </table>
    </div>`;
}

// ── GENERIC TABLE ──
async function renderGenericTable(table, title, cols){
  const rows = await api(table,'order=id.asc&limit=200');
  const colLabel = {id:'ID',business_name:'Name',city:'City',country:'Country',status:'Status',item_name:'Item',price_normal:'Price',item_category_first:'Category'};

  const isMobile = window.innerWidth <= 768;

  if(isMobile){
    // Render as stacked cards on mobile
    document.getElementById('mainContent').innerHTML = `
      <div class="page-hd">
        <div class="page-title">${title}</div>
        <div class="page-sub">${rows.length} records</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:8px;">
        ${rows.length ? rows.map(r=>{
          const name = esc(String(r.business_name || r.item_name || '#'+r.id));
          const sub = [r.city, r.country].filter(Boolean).join(', ') || (r.item_name && r.business_name ? esc(r.business_name) : '');
          const price = r.price_normal ? `<span class="mono" style="font-size:13px;color:var(--text);">$${r.price_normal}</span>` : '';
          const status = r.status ? `<span class="badge s-${r.status}">${r.status}</span>` : '';
          return `<div style="background:var(--surface);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;">
            <div style="min-width:0;flex:1;">
              <div style="font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${name}</div>
              ${sub ? `<div style="font-size:12px;color:var(--text-mid);margin-top:2px;">${sub}</div>` : ''}
            </div>
            <div style="display:flex;align-items:center;gap:8px;flex-shrink:0;">${price}${status}</div>
          </div>`;
        }).join('') : `<div class="empty"><i class="ti ti-database"></i>No records</div>`}
      </div>`;
    return;
  }

  document.getElementById('mainContent').innerHTML = `
    <div class="page-hd">
      <div class="page-title">${title}</div>
      <div class="page-sub">${rows.length} records</div>
    </div>
    <div class="tbl-wrap">
      <table>
        <thead><tr>${cols.map(c=>`<th>${colLabel[c]||c}</th>`).join('')}</tr></thead>
        <tbody>
          ${rows.length ? rows.map(r=>`<tr>${cols.map(c=>{
            if(c==='status') return `<td><span class="badge s-${r[c]}">${r[c]||'—'}</span></td>`;
            if(c==='price_normal') return `<td class="mono">$${r[c]||0}</td>`;
            if(c==='id') return `<td class="mono">${esc(r[c])}</td>`;
            return `<td><span class="ellip">${esc(String(r[c]||'—'))}</span></td>`;
          }).join('')}</tr>`).join('') :
          `<tr><td colspan="${cols.length}"><div class="empty"><i class="ti ti-database"></i>No records</div></td></tr>`}
        </tbody>
      </table>
    </div>`;
}
</script>
</body>
